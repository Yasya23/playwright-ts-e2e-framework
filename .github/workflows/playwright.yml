name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Type Check
        run: npm run type-check

      - name: Install Playwright Browsers with dependencies
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        env:
          CI: true
          BASE_API_URL: ${{ secrets.BASE_API_URL}}
          BASE_URL: ${{ secrets.BASE_URL}}
          USER_EMAIL_1: ${{ secrets.USER_EMAIL_1}}
          USER_PASSWORD_1: ${{ secrets.USER_PASSWORD_1}}
          USER_EMAIL_2: ${{ secrets.USER_EMAIL_2}}
          USER_PASSWORD_2: ${{ secrets.USER_PASSWORD_2}}
          USER_EMAIL_3: ${{ secrets.USER_EMAIL_3}}
          USER_PASSWORD_3: ${{ secrets.USER_PASSWORD_3}}
        run: npx playwright test

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
